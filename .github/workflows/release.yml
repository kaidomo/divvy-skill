name: Release

on:
  workflow_dispatch:
    inputs:
      tag: {required: true, type: string, description: "Stable annotated tag to verify and publish"}

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-main

jobs:
  verify-tag:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.evidence.outputs.tag }}
      tag_object: ${{ steps.evidence.outputs.tag_object }}
      tag_commit: ${{ steps.evidence.outputs.tag_commit }}
      notes_sha: ${{ steps.evidence.outputs.notes_sha }}
      workflow_revision: ${{ steps.evidence.outputs.workflow_revision }}
      checkout_sha: ${{ steps.evidence.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release controls without effect credentials
        run: |
          set -eu
          python3 tests/test_release.py
          env -u CODEX_SANDBOX python3 tests/run_tests.py
          python3 scripts/ledger_distribution.py --check templates/LEDGER.md
          git diff --check
      - name: Verify stable tag and release metadata
        id: evidence
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo 'INVALID_STABLE_TAG' >&2; exit 2; }
          test "$GITHUB_REPOSITORY" = "kaidomo/divvy-skill"
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "$(git status --porcelain)"
          git fetch origin main --tags --force
          tag_commit="$(git rev-list -n 1 "$TAG")"
          test "$GITHUB_SHA" = "$tag_commit"
          test "$tag_commit" = "$(git rev-parse origin/main)"
          python3 scripts/release.py check --tag "$TAG" --history
          python3 scripts/release.py verify-tag "$TAG" --target "$tag_commit"
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release.py notes --output "$notes"
          notes_sha="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$notes")"
          {
            echo "tag=$TAG"
            echo "tag_object=$(git rev-parse "$TAG^{tag}")"
            echo "tag_commit=$tag_commit"
            echo "notes_sha=$notes_sha"
            echo "workflow_revision=$(git rev-parse HEAD:.github/workflows/release.yml)"
            echo "checkout_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

  publish-tag:
    needs: verify-tag
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.checkout_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Complete credential-free publication preflight
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-tag.outputs.tag_object }}
          EXPECTED_TAG_COMMIT: ${{ needs.verify-tag.outputs.tag_commit }}
          EXPECTED_NOTES_SHA: ${{ needs.verify-tag.outputs.notes_sha }}
          EXPECTED_WORKFLOW_REVISION: ${{ needs.verify-tag.outputs.workflow_revision }}
          EXPECTED_CHECKOUT_SHA: ${{ needs.verify-tag.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kaidomo/divvy-skill"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_CHECKOUT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT_SHA"
          test "$(git rev-parse HEAD:.github/workflows/release.yml)" = "$EXPECTED_WORKFLOW_REVISION"
          test "$(git rev-parse "$TAG^{tag}")" = "$EXPECTED_TAG_OBJECT"
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_TAG_COMMIT"
          python3 scripts/release.py check --tag "$TAG" --history
          python3 scripts/release.py verify-tag "$TAG" --target "$EXPECTED_TAG_COMMIT"
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release.py notes --output "$notes"
          test "$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$notes")" = "$EXPECTED_NOTES_SHA"
          expected="$RUNNER_TEMP/expected-release.json"
          python3 - "$TAG" "$notes" "$expected" <<'PY'
          import json, sys
          json.dump({"tag_name": sys.argv[1], "name": sys.argv[1],
                     "body": open(sys.argv[2], encoding="utf-8").read(),
                     "draft": False, "prerelease": False}, open(sys.argv[3], "w"))
          PY
      - name: Mint one repository-scoped short-lived App token
        id: app
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_INSTALLATION_ID: ${{ vars.RELEASE_APP_INSTALLATION_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/release.py mint-app-token \
            --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
      - name: Reconcile Release with the verified snapshot
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-tag.outputs.tag_object }}
          EXPECTED_TAG_COMMIT: ${{ needs.verify-tag.outputs.tag_commit }}
          EXPECTED_NOTES_SHA: ${{ needs.verify-tag.outputs.notes_sha }}
          EXPECTED_WORKFLOW_REVISION: ${{ needs.verify-tag.outputs.workflow_revision }}
          EXPECTED_CHECKOUT_SHA: ${{ needs.verify-tag.outputs.checkout_sha }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-release.json"
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          remote_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag_object" --jq .object.sha)"
          test "$remote_tag_commit" = "$EXPECTED_TAG_COMMIT"
          observed="$RUNNER_TEMP/observed-release.json"
          release_list="$RUNNER_TEMP/release-list.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$release_list"
          existing_release="$(python3 scripts/release.py find-release --tag "$TAG" --input "$release_list" | jq -c '.release // empty')"
          created=false
          if test -z "$existing_release"; then
            # Re-read the immutable tag and live main at the write boundary.
            remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
            test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
            remote_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag_object" --jq .object.sha)"
            test "$remote_tag_commit" = "$EXPECTED_TAG_COMMIT"
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$current_main" = "$EXPECTED_TAG_COMMIT"
            created=true
            draft_expected="$RUNNER_TEMP/draft-release.json"
            jq '.draft = true' "$expected" > "$draft_expected"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$draft_expected" > "$observed"
            release_id="$(jq -r .id "$observed")"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$observed"
          else
            printf '%s\n' "$existing_release" >"$observed"
          fi
          comparison_expected="$expected"
          if test "$created" = true; then comparison_expected="$RUNNER_TEMP/draft-release.json"; fi
          comparison_input="$RUNNER_TEMP/comparison-input.json"
          python3 -c 'import json, sys; json.dump({"expected": json.load(open(sys.argv[1])), "observed": json.load(open(sys.argv[2]))}, open(sys.argv[3], "w"))' \
            "$comparison_expected" "$observed" "$comparison_input"
          python3 scripts/release.py compare-release --input "$comparison_input" >/dev/null
          if test "$created" = true; then echo "RELEASE_CREATED_AND_READ_BACK"; else echo "MATCHING_NOOP"; fi
          if test "$created" = true; then
            release_id="$(jq -r .id "$observed")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false > "$observed"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$observed"
            jq -e '(.draft == false)' "$observed" >/dev/null
            comparison_input_after_publish="$RUNNER_TEMP/comparison-input-after-publish.json"
            python3 -c 'import json, sys; json.dump({"expected": json.load(open(sys.argv[1])), "observed": json.load(open(sys.argv[2]))}, open(sys.argv[3], "w"))' \
              "$expected" "$observed" "$comparison_input_after_publish"
            python3 scripts/release.py compare-release --input "$comparison_input_after_publish" >/dev/null
          fi
          final_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$final_tag_object" = "$EXPECTED_TAG_OBJECT"
          final_tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$final_tag_object" --jq .object.sha)"
          test "$final_tag_commit" = "$EXPECTED_TAG_COMMIT"
          python3 - "$observed" "$TAG" "$EXPECTED_TAG_OBJECT" "$EXPECTED_TAG_COMMIT" "$EXPECTED_NOTES_SHA" "$EXPECTED_WORKFLOW_REVISION" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib, json, sys
          observed = json.load(open(sys.argv[1], encoding='utf-8'))
          receipt = {
              "tag": sys.argv[2], "tag_object": sys.argv[3], "tag_commit": sys.argv[4],
              "notes_sha256": sys.argv[5], "workflow_revision": sys.argv[6],
              "release_id": observed.get("id"), "release_url": observed.get("html_url"),
              "readback_sha256": hashlib.sha256(json.dumps(observed, sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
          }
          print("\n### Release receipt\n\n```json")
          print(json.dumps(receipt, sort_keys=True, indent=2))
          print("```")
          PY
