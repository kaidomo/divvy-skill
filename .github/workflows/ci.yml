name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Show Python version
        run: python3 --version
      - name: Validate release metadata
        run: python3 scripts/release.py check
      - name: Run tests
        run: env -u CODEX_SANDBOX python3 tests/run_tests.py
      - name: Check LEDGER distribution
        run: python3 scripts/ledger_distribution.py --check templates/LEDGER.md
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
